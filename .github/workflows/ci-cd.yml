# À copier dans <repo>/.github/workflows/ci-cd.yml
# Adapter uniquement les 2 variables IMAGE et SERVICE.
name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/ag69075/discord-bot-switch2   # <- à adapter (minuscules obligatoires)
  SERVICE: switch2-bot                          # <- nom du service dans docker-compose.yml
  COMPOSE_FILE: /volume2/docker/discord-bots/docker-compose.yml

concurrency:
  group: deploy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & push image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Login GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64        # passer à linux/arm64 si ton Synology est ARM
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy on Synology
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, synology]
    permissions:
      contents: read
      packages: read
    environment: production
    steps:
      - name: Login GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Pull & restart
        run: |
          docker compose -f "$COMPOSE_FILE" pull "$SERVICE"
          docker compose -f "$COMPOSE_FILE" up -d --no-deps "$SERVICE"

      - name: Vérifier que le conteneur tourne
        run: |
          sleep 15
          docker compose -f "$COMPOSE_FILE" ps "$SERVICE"
          test "$(docker compose -f "$COMPOSE_FILE" ps --status running -q "$SERVICE" | wc -l)" -eq 1

      - name: Nettoyage des anciennes images
        if: always()
        run: docker image prune -f
